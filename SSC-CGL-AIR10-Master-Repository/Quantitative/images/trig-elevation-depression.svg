<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="270" fill="#ffffff"/>
  <text x="240" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Angle of Elevation vs Depression</text>
  <!-- ELEVATION (left) -->
  <text x="120" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">Elevation (look up)</text>
  <line x1="30" y1="210" x2="210" y2="210" stroke="#888" stroke-width="1.5"/>
  <line x1="190" y1="210" x2="190" y2="90" stroke="#188038" stroke-width="2.5"/>
  <line x1="40" y1="210" x2="190" y2="90" stroke="#d93025" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="40" cy="210" r="4" fill="#333"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" fill="#188038">Top</text>
  <text x="205" y="155" font-size="14" font-weight="bold" fill="#188038">h</text>
  <text x="115" y="227" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">d</text>
  <path d="M 80 210 A 40 40 0 0 0 73 188" fill="none" stroke="#d93025" stroke-width="1.5"/>
  <text x="70" y="204" font-size="13" fill="#d93025" font-style="italic">&#952;</text>
  <text x="40" y="248" font-size="12" fill="#555">observer</text>
  <!-- DEPRESSION (right) -->
  <text x="360" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#a142f4">Depression (look down)</text>
  <line x1="290" y1="90" x2="290" y2="210" stroke="#188038" stroke-width="2.5"/>
  <line x1="290" y1="90" x2="430" y2="90" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="290" y1="90" x2="450" y2="210" stroke="#d93025" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="290" y1="210" x2="450" y2="210" stroke="#888" stroke-width="1.5"/>
  <circle cx="450" cy="210" r="4" fill="#333"/>
  <text x="290" y="84" text-anchor="middle" font-size="13" fill="#188038">Top</text>
  <text x="455" y="226" font-size="12" fill="#555">object</text>
  <path d="M 330 90 A 40 40 0 0 0 322 105" fill="none" stroke="#d93025" stroke-width="1.5"/>
  <text x="332" y="108" font-size="13" fill="#d93025" font-style="italic">&#952;</text>
  <text x="240" y="262" text-anchor="middle" font-size="13" fill="#555">tan&#952; = h / d &#160;&#160;&#8594;&#160;&#160; h = d &#183; tan&#952; &#160;&#160;(elevation from base = depression from top)</text>
</svg>
