<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="470" fill="#ffffff"/>
  <text x="220" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Unit Circle: identity &amp; sign of ratios (ASTC)</text>
  <text x="220" y="46" text-anchor="middle" font-size="15" fill="#d93025">sin&#178;&#952; + cos&#178;&#952; = 1</text>
  <!-- center -->
  <!-- O = (220,250), r = 150 -->
  <circle cx="220" cy="250" r="150" fill="#f5faff" stroke="#1a73e8" stroke-width="2"/>
  <!-- axes -->
  <line x1="50" y1="250" x2="390" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="220" y1="80" x2="220" y2="420" stroke="#888" stroke-width="1.5"/>
  <text x="396" y="246" font-size="13" fill="#666">x (cos)</text>
  <text x="226" y="92" font-size="13" fill="#666">y (sin)</text>
  <!-- point P at 40 deg: (220+114.9, 250-96.4)=(334.9,153.6) -->
  <line x1="220" y1="250" x2="335" y2="154" stroke="#d93025" stroke-width="2.5"/>
  <!-- sin (vertical) -->
  <line x1="335" y1="154" x2="335" y2="250" stroke="#188038" stroke-width="2.5"/>
  <!-- cos (horizontal) -->
  <line x1="220" y1="250" x2="335" y2="250" stroke="#a142f4" stroke-width="2.5" stroke-dasharray="1"/>
  <circle cx="335" cy="154" r="4" fill="#d93025"/>
  <text x="270" y="190" font-size="15" fill="#d93025" font-weight="bold" transform="rotate(-40 270 190)">1</text>
  <text x="345" y="205" font-size="14" fill="#188038" font-weight="bold">sin&#952;</text>
  <text x="262" y="270" font-size="14" fill="#a142f4" font-weight="bold">cos&#952;</text>
  <path d="M 250 250 A 30 30 0 0 0 243 232" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="248" y="244" font-size="14" fill="#333" font-style="italic">&#952;</text>
  <!-- quadrant labels -->
  <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">I &#8212; All +</text>
  <text x="135" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">II &#8212; sin +</text>
  <text x="135" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">III &#8212; tan +</text>
  <text x="305" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">IV &#8212; cos +</text>
  <text x="220" y="445" text-anchor="middle" font-size="13" fill="#555">P = (cos&#952;, sin&#952;),&#160; radius = 1&#160; &#8594;&#160; &#8220;All Students Take Coffee&#8221;</text>
</svg>
